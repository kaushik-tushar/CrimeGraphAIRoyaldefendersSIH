<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shield.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="National Crime Records Bureau - High-Performance Tactical Criminal Network Analysis & Forensic Investigation Platform"
    />
    
    <title>NCRB • Tactical Intelligence & Criminal Network Analysis System</title>

    <!-- Google Fonts Preconnect for JetBrains Mono and Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Prevent FOUC (Flash of Unstyled Content) during initial load -->
    <style>
      body {
        background-color: #030712;
        color: #f3f4f6;
        margin: 0;
        padding: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      #root:empty {
        display: flex;
        height: 100vh;
        width: 100vw;
        align-items: center;
        justify-content: center;
        background-color: #030712;
      }
      #root:empty::after {
        content: "INITIALIZING TACTICAL SECURE NODE...";
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        letter-spacing: 0.15em;
        color: #00f0ff;
        animation: pulse 1.5s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
